<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harry Reid International Airport</title>
    
    <link rel="stylesheet" href="css/airport.css">
</head>
<body>

    <div id="background"> <!--Lagt til med blå bakgrunn i tilfelle siden sees på en større skjerm-->

        <div class="container"> <!--Utgangspunkt for posisjoneringen-->


        <!--"Logo" på flyplassen-->
            <div id="heading" class="container"> 
                Harry Reid International Airport
            </div>

        <!--Flyet som skal fly etter en liten stund-->    
            <div class="container">
                <img id="airplane" src="Images/airplane.png" alt="Fly">
            </div>

        <!--Skinnende sol-->
            <div class="container">
                <img id="sun" src="Images/sun.jpeg" alt="Sol">
            </div>

        <!--Fugl som skal fly med en gang-->    
            <div class="container">
                <img id="bird" src="Images/bird.jpeg" alt="Flyvende fugl">
             </div>

        <!--Skilt som viser veien hjem og som skal fly videre sammen med flyet-->     
            <div id="homeBox">
                Way Home!
            </div>

            <div id="playAgain" class="container">
                
                <a href="startside.html">You made it! Click here to play again! 
                    
                </a>
            
            </div>

        </div>
    </div>
    
</body>
</html>
